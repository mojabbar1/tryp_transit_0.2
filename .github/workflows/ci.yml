name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - run: npm run lockfile:check
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build

  python:
    name: python (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: python -m py_compile model_service/*.py

  data-agent:
    name: data-agent (ruff, migrations, pytest with Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_agent
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # A throwaway CI database with trust auth, so no password exists anywhere in CI.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A DB test that would skip fails instead, so the grant, role, and append-only tests always run.
      TDA_REQUIRE_DB_TESTS: '1'
      TDA_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/tda_test
      TDA_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/tda_test
      TDA_DATABASE_URL: postgresql://tda_writer@localhost:5432/tda_test
      TDA_READER_DATABASE_URL: postgresql://tda_reader@localhost:5432/tda_test
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.9.10'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: data_agent/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run tda db bootstrap && uv run alembic upgrade head
      - run: uv run pytest -q

  secrets:
    name: secrets (gitleaks, changed commits only)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      # Scan only the commits this PR (or push) adds; the history-only allowlist lives in .gitleaks.toml (D-13).
      - name: Scan the PR diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="-1 ${PUSH_AFTER}"
          fi
          echo "Scanning commits: ${range}"
          ./gitleaks git . --config .gitleaks.toml --log-opts="${range}" --redact --no-banner --verbose
