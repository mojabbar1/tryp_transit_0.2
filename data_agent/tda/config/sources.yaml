# Source registry: the source of truth for the `source` table (02 §6.1). An entry is `proposed` until a PR flips
# it to `approved`, after the terms review in 03 §2.4 and the maintainer's sign-off in 05 §6 (terms_reviewed_by
# / _at). Nothing that isn't approved runs.
# Values mirror the 03 catalog. Cadences (UTC cron) and stale_after_hours are proposals for P3 to finalize.
# S-8 (SC511) is omitted: 03 excludes it (no public API; consumer terms only).
