  url: https://data.trilliumtransit.com/gtfs/carta-sc-us/carta-sc-us.zip
  license: 'Transitland registry: use without attribution; derived products allowed'
  terms_url: https://www.transit.land/feeds/f-djz4-carta~sc~us
  terms_summary: 'Registry-only licence (re-verified 2026-09-27, 05 §6a): Transitland lists use without attribution
    and derived products as allowed; its licence URL, redistribution, and commercial-use fields are empty, and the
    feed''s feed_license is empty. Raw zip kept 180 days; normalized rows kept; derived facts carry CARTA/Trillium
    attribution; the raw feed is never redistributed. Accepted by the maintainer, 2026-09-28 (05 §6).'
  store_policy: ttl:180d
  store_policy_reason: 'Open GTFS feed: raw snapshots kept 180 days (D-18); feed versions kept'
  cadence: 0 9 * * *
  stale_after_hours: 72
  attribution_text: 'Schedule data: CARTA GTFS (via Trillium)'
  notes: New versions about monthly; poll daily with a conditional GET
  auth: none
  robots_required: false
  # Signed in 05 §6 by mojabbar, 2026-09-28 08:08 ET ("approve all for p3"), accepting the registry-only licence.
  status: approved
  terms_reviewed_by: mojabbar
  terms_reviewed_at: 2026-09-28
  owner: mojabbar
