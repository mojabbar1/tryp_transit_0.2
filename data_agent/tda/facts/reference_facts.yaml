# Reference facts (P3.5): the 05 §2 assumptions, loaded as `candidate` facts by `tda facts load-reference`.
#
# The agent never fills in a number (P3.5). Every value starts as `value: null` (or `value_text: null`) with a
# `todo` saying where to verify it. A HUMAN enters the verified value, plus `quote` or `page`, `retrieved_at`, and
# `verified_by`. The loader refuses a filled entry that's missing any of them. The approved values and their
# verbatim evidence are in docs/transit-data-agent/05-decisions-and-review.md §2 and §2a. Null entries are skipped.
# Each loaded fact is a `candidate` until someone runs `tda review approve <item>`.
facts:
  - key: drive.fuel_price_usd_per_gal
    value: null
    unit: USD per gallon (weekly regular gasoline, Lower Atlantic PADD 1C)
    source_id: eia-gas
    geography: region:padd-1c
    url: https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=EMM_EPMR_PTE_R1Z_DPG&f=W
    todo: provided weekly by the eia_gas connector (P3.4); enter a value only for a manual snapshot (05 §2)

  - key: drive.mpg
    value: null
    unit: miles per gallon (average gasoline vehicle on the road)
    source_id: epa-typical-vehicle
    geography: country:us
    url: https://www.epa.gov/greenvehicles/greenhouse-gas-emissions-typical-passenger-vehicle
    todo: verify from the EPA page (EPA-420-F-23-014), the fuel-economy sentence; approved value in 05 §2

  - key: co2.car_g_per_mile
