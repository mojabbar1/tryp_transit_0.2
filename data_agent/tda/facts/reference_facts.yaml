# Reference facts (P3.5): the 05 §2 assumptions, loaded as `candidate` facts by `tda facts load-reference`.
#
# The agent never fills in a number (P3.5). Every value starts as `value: null` (or `value_text: null`) with a
# `todo` saying where to verify it. A HUMAN enters the verified value, plus `quote` or `page`, `retrieved_at`, and
# `verified_by`. The loader refuses a filled entry that's missing any of them. The approved values and their
# verbatim evidence are in docs/transit-data-agent/05-decisions-and-review.md §2 and §2a. Null entries are skipped.
# Each loaded fact is a `candidate` until someone runs `tda review approve <item>`.
#
# Transcription (2026-10-11): the filled entries below copy, exactly, the "Approved value" column of 05 §2, which the
# maintainer (mojabbar) approved on 2026-09-27 (chat, see 05 §7 P1), with the verbatim evidence from 05 §2a
# (retrieved 2026-09-25 ET; decisions dated 2026-09-27). They are historically dated, recorded assumptions: the
# Copilot builder transcribed them on 2026-10-11 under the maintainer's 2026-10-11 instruction, and **no new human
# verification of any source happened on that date**. Not transcribed: `drive.fuel_price_usd_per_gal` (the current
# weekly value comes from the approved eia_gas connector, never the old 4.163) and `parking.applies_to_stops`
# (05 §2 has no approved value).
facts:
  - key: drive.fuel_price_usd_per_gal
    value: null
    unit: USD per gallon (weekly regular gasoline, Lower Atlantic PADD 1C)
    source_id: eia-gas
    geography: region:padd-1c
    url: https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=EMM_EPMR_PTE_R1Z_DPG&f=W
    todo: provided weekly by the eia_gas connector (P3.4); enter a value only for a manual snapshot (05 §2)

  - key: drive.mpg
    value: 22.2
    unit: miles per gallon (average gasoline vehicle on the road)
    source_id: epa-typical-vehicle
    geography: country:us
    url: https://www.epa.gov/greenvehicles/greenhouse-gas-emissions-typical-passenger-vehicle
    quote: "This assumes the average gasoline vehicle on the road today has a fuel economy of about 22.2 miles per gallon and drives around 11,500 miles per year."
    retrieved_at: 2026-09-25
    verified_by: &transcribed "mojabbar (approved value, 05 §2, 2026-09-27); transcribed from 05 §2/§2a by the Copilot builder 2026-10-11, no new verification"
    note: On-road fleet average, not new cars (05 §2a)

  - key: co2.car_g_per_mile
    value: 400
    unit: g CO2 per vehicle-mile (tailpipe)
    source_id: epa-typical-vehicle
    geography: country:us
    url: https://www.epa.gov/greenvehicles/greenhouse-gas-emissions-typical-passenger-vehicle
    quote: "The average passenger vehicle emits about 400 grams of CO2 per mile."
    retrieved_at: 2026-09-25
    verified_by: *transcribed
    note: Tailpipe only (05 §2a)

  - key: drive.maintenance_usd_per_mile
    value: 0.1104
    unit: USD per mile (maintenance, repair and tires; includes an extended warranty)
    source_id: aaa-driving-costs
    geography: country:us
    url: https://newsroom.aaa.com/wp-content/uploads/2025/09/UPDATE-AAA-Fact-Sheet-Your-Driving-Cost-9.2025-1.pdf
    page: p. 1
    quote: "Maintenance, Repair & Tires 11.04¢/mile"
    retrieved_at: 2026-09-25
    verified_by: *transcribed
    note: National average for new cars; includes an allocated extended-warranty cost, so not purely marginal (05 §2a)

  - key: drive.total_cost_usd_per_mile
    value: 0.77
    unit: USD per mile (total cost to own and operate, 15,000 miles a year; annual stats only)
    source_id: aaa-driving-costs
    geography: country:us
    url: https://newsroom.aaa.com/wp-content/uploads/2025/09/UPDATE-AAA-Fact-Sheet-Your-Driving-Cost-9.2025-1.pdf
    page: p. 1
    quote: "Average Ownership Costs Per Mile — Miles per Year 10k 15k 20k — Average Cost $1.00 77¢ 66¢"
    retrieved_at: 2026-09-25
    verified_by: *transcribed
    note: The printed 15k-mile value (05 §2 "as printed")

  - key: parking.downtown_usd
    value: 24.00
    unit: USD per standard-rate workday in a City garage
    source_id: carta-fares-parking
    geography: place:charleston-sc
    url: https://www.charleston-sc.gov/1025/Where-to-Park
    quote: "Garages - Rates Per 20 Min: Rates $1, Daily Max* $24. * Daily is 12 midnight to 12 midnight, computed per single parking event."
    retrieved_at: 2026-09-25
    verified_by: *transcribed
    note: Standard-rate, self-paid workday scenario (05 §2); no evening discount, exemption, or employer-paid parking

  - key: transit.base_fare_usd
