[project]
name = "tryp-data-agent"
version = "0.1.0"
description = "Tryp Transit data agent: provenance-first ingestion, versioned facts, and a read API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "typer>=0.12",
  "structlog>=24.1",
  "apscheduler>=3.10,<4",
  "pyyaml>=6.0",
]

[project.scripts]
tda = "tda.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tda"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Every external request goes through tda.http.polite_client."
"urllib.request.urlopen".msg = "Every external request goes through tda.http.polite_client."

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs Postgres via TDA_TEST_DATABASE_URL (required when TDA_REQUIRE_DB_TESTS=1)"]
addopts = "-p no:cacheprovider"
